plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotbugs) apply false
    alias(libs.plugins.spotless)
}

def version_number = new File(rootDir.getAbsolutePath(), 'VERSION').readLines()[0].trim()

allprojects {

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    group = 'com.isxcode.spark'
    version = version_number

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url "https://plugins.gradle.org/m2/" }
    }

    configurations.configureEach {
        exclude group: "org.apache.logging.log4j", module: "log4j-slf4j-impl"
        exclude group: "org.slf4j", module: "slf4j-reload4j"
        exclude group: "com.sun.xml.bind", module: "jaxb-core"
        resolutionStrategy.dependencySubstitution {
            substitute module('org.lz4:lz4-java') using module("at.yawk.lz4:lz4-java:${libs.versions.lz4.get()}")
        }
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.apache.kafka' && details.requested.name == 'kafka-clients') {
                details.useVersion libs.versions.kafka.get()
            }
            if (details.requested.group == 'org.bouncycastle'
                && ['bcpkix-jdk18on', 'bcprov-jdk18on', 'bcutil-jdk18on'].contains(details.requested.name)) {
                details.useVersion libs.versions.bouncycastle.get()
            }
        }
    }

    dependencies {

        implementation 'org.springframework.boot:spring-boot-starter-web'

        implementation 'org.springframework.boot:spring-boot-starter-aop'

        implementation 'org.springframework.boot:spring-boot-starter-validation'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'

        implementation libs.springdoc.openapi.starter.webmvc.ui

        compileOnly libs.lombok
        annotationProcessor libs.lombok

        implementation libs.fastjson

        testImplementation 'org.junit.jupiter:junit-jupiter'

        implementation libs.mapstruct
        implementation libs.mapstruct.processor
        annotationProcessor libs.mapstruct.processor
        testAnnotationProcessor libs.mapstruct.processor
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    tasks.named('bootJar') {
        enabled = false
    }

    tasks.named('jar') {
        enabled = true
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configDirectory = rootProject.layout.projectDirectory.dir('format/checkstyle')
    }

    tasks.withType(Checkstyle).configureEach {
        maxWarnings = 0
        maxErrors = 0
        ignoreFailures = false
        config resources.text.fromFile(rootProject.file('format/checkstyle/checkstyle.xml'))
        reports {
            xml.required = false
            html.required = true
            html.stylesheet resources.text.fromFile(rootProject.file('format/checkstyle/checkstyle-simple.xsl'))
        }
        doLast {
            def reportFile = reports.html.outputLocation.get().asFile
            if (reportFile.exists()) {
                println "Checkstyle HTML report: ${reportFile.toURI()}"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    pmd {
        toolVersion = libs.versions.pmd.get()
        ignoreFailures = false
        consoleOutput = true
        ruleSets = []
        ruleSetFiles = files(rootProject.file('format/pmd/ruleset.xml'))
    }

    configurations.named('pmd') {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                details.useVersion '3.20.0'
            }
            if (details.requested.group == 'com.google.code.gson' && details.requested.name == 'gson') {
                details.useVersion '2.14.0'
            }
        }
    }

    configurations.named('spotbugs') {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                details.useVersion '3.19.0'
            }
            if (details.requested.group == 'com.google.code.gson' && details.requested.name == 'gson') {
                details.useVersion '2.13.2'
            }
        }
    }

    tasks.withType(Pmd).configureEach {
        ignoreFailures = false
        reports {
            xml.required = false
            html.required = true
        }
        doLast {
            def reportFile = reports.html.outputLocation.get().asFile
            if (reportFile.exists()) {
                println "PMD HTML report: ${reportFile.toURI()}"
            }
        }
    }

    spotbugs {
        toolVersion = libs.versions.spotbugs.tool.get()
        ignoreFailures = false
        effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
        excludeFilter = rootProject.file('format/spotbugs/exclude.xml')
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        showStackTraces = true
        showProgress = true
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        ignoreFailures = false
        reports {
            html.required = true
            xml.required = false
        }
        doLast {
            def reportFile = reports.html.outputLocation.get().asFile
            if (reportFile.exists()) {
                println "SpotBugs HTML report: ${reportFile.toURI()}"
            }
        }
    }
}

spotless {
    java {
        def javaSourceTrees = allprojects.findAll { it.plugins.hasPlugin('java') }.collectMany { javaProject ->
            javaProject.sourceSets.collectMany { sourceSet ->
                sourceSet.allJava.srcDirs
                    .findAll { it.exists() }
                    .collect { sourceDir ->
                        javaProject.fileTree(sourceDir) {
                            include '**/*.java'
                        }
                    }
            }
        }
        target(*javaSourceTrees)
        eclipse().configFile(rootProject.file('format/spotless/eclipse-java-google-style.xml'))
        removeUnusedImports()
    }
}

tasks.register("format") {
    dependsOn(":spark-yun-dist:copy_version", ":spotlessApply", ":spark-yun-frontend:format_frontend")
    dependsOn(subprojects.findAll { it.path != ':spark-yun-frontend' }.collect { "${it.path}:check" })
}

tasks.register('cleanAll') {

    dependsOn(allprojects.collect { "${it.path}:clean" })
}

tasks.register('package') {

    dependsOn('install', 'cleanAll', ':spark-yun-dist:make')
}

tasks.register('start', Exec) {

    commandLine 'sh', '-c', '''
      rm -rf spark-yun-dist/build/distributions/zhiqingyun
      tar -vzxf spark-yun-dist/build/distributions/zhiqingyun.tar.gz -C spark-yun-dist/build/distributions/
      cd spark-yun-dist/build/distributions/zhiqingyun/bin
      bash start.sh
    '''
}

tasks.register('website', Exec) {

    workingDir 'spark-yun-vip/docs'

    commandLine 'sh', '-c', '''
      pnpm install --frozen-lockfile
      pnpm run dev
     '''
}

tasks.register('frontend', Exec) {

    dependsOn(':spark-yun-frontend:pnpmInstall')

    workingDir 'spark-yun-frontend'
    commandLine 'sh', '-c', '''
      set -e
      if command -v node >/dev/null 2>&1 && [ "$(node --version | sed 's/^v//')" = "22.22.3" ]; then
        pnpm run dev --host
      elif command -v fnm >/dev/null 2>&1; then
        fnm exec --using 22.22.3 sh -lc 'pnpm run dev --host'
      else
        pnpm run dev --host
      fi
    '''
}

tasks.register('backend') {

    dependsOn(':spark-yun-backend:spark-yun-main:bootRun')
}

tasks.register('install', Exec) {
    if (!System.properties['os.name'].toString().contains('Mac OS X')) {
        doFirst {
            exec {
                commandLine 'sh', '-c', "sed -i 's/\\r\$//' install.sh"
            }
        }
    }
    commandLine 'sh', '-c', 'bash install.sh'
}

tasks.named('cleanAll') {
    mustRunAfter('install')
}

gradle.projectsEvaluated {
    def installTask = tasks.named('install')
    def cleanAllTask = tasks.named('cleanAll')

    allprojects.each { project ->
        project.tasks.matching { it.name == 'clean' }.configureEach {
            mustRunAfter(installTask)
        }
        project.tasks.matching {
            it.path != ':install' && it.path != ':cleanAll' && it.name != 'clean'
        }.configureEach {
            mustRunAfter(cleanAllTask)
        }
    }
}

tasks.register('docker', Exec) {

    commandLine 'sh', '-c', '''
      docker buildx uninstall
      docker build -t isxcode/zhiqingyun:''' + version_number + ''' -f ./Dockerfile .
     '''
}

tasks.register('upload-ali-oss', Exec) {

    commandLine 'sh', '-c', '''
      scp spark-yun-dist/build/distributions/zhiqingyun.tar.gz root@zhiqingyun.isxcode.com:/data/file/
     '''
}

tasks.register('upload-docker-hub', Exec) {

    commandLine 'sh', '-c', '''
      docker buildx install
      docker buildx build --platform linux/amd64,linux/arm64/v8 -t isxcode/zhiqingyun:latest -f ./Dockerfile . --push
     '''
}

tasks.register('upload-ali-hub', Exec) {

    commandLine 'sh', '-c', '''
      docker buildx install
      docker rmi registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-amd64
      docker buildx build --platform linux/amd64 -t registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-amd64 -f ./Dockerfile . --load
      docker push registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-amd64
      docker rmi registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-arm64
      docker buildx build --platform linux/arm64/v8 -t registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-arm64 -f ./Dockerfile . --load
      docker push registry.cn-shanghai.aliyuncs.com/isxcode/zhiqingyun:latest-arm64      
     '''
}
