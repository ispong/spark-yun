import groovy.json.JsonSlurper

def packageJsonFile = layout.projectDirectory.file('package.json')
def packageMetadata = new JsonSlurper().parse(packageJsonFile.asFile)
def requiredPnpmVersion = packageMetadata.packageManager.toString().split('@').last()
def requiredNodeVersion = packageMetadata.engines.node.toString()
def frontendDist = layout.projectDirectory.dir('dist')

def readCommandVersion = { String command ->
    def output = new ByteArrayOutputStream()
    exec {
        commandLine command, '--version'
        standardOutput = output
    }
    output.toString('UTF-8').trim()
}

tasks.register('validateFrontendRuntime') {

    inputs.file(packageJsonFile)
    outputs.upToDateWhen { false }

    doLast {
        def nodeVersion = readCommandVersion('node')
        def pnpmVersion = readCommandVersion('pnpm')

        if (nodeVersion.replaceFirst('^v', '') != requiredNodeVersion) {
            throw new GradleException(
                "Node.js ${nodeVersion} is unsupported. Install Node.js ${requiredNodeVersion}."
            )
        }
        if (pnpmVersion != requiredPnpmVersion) {
            throw new GradleException(
                "pnpm ${pnpmVersion} is unsupported. Install pnpm ${requiredPnpmVersion}."
            )
        }

        logger.lifecycle("Frontend runtime: Node.js ${nodeVersion}, pnpm ${pnpmVersion}")
    }
}

tasks.register('pnpmInstall', Exec) {

    dependsOn('validateFrontendRuntime')

    inputs.files(
        packageJsonFile,
        layout.projectDirectory.file('pnpm-lock.yaml'),
        layout.projectDirectory.file('pnpm-workspace.yaml'),
        layout.projectDirectory.file('.npmrc')
    )
    outputs.upToDateWhen { false }

    commandLine 'pnpm', 'install', '--frozen-lockfile', '--prefer-offline'
}

// Format and check frontend code.
tasks.register('format_frontend', Exec) {

    dependsOn('pnpmInstall')

    commandLine 'sh', '-c', '''
      set -e
      pnpm run format
      pnpm run lint
      pnpm run type-check
    '''
}

// Build frontend assets with Gradle input and output tracking.
tasks.register('npmBuild', Exec) {

    dependsOn('pnpmInstall')

    inputs.files(
        fileTree('src'),
        fileTree('public'),
        fileTree(projectDir) {
            include 'index.html'
            include '.env*'
            include 'components.d.ts'
            include 'env.d.ts'
            include 'package.json'
            include 'pnpm-lock.yaml'
            include 'pnpm-workspace.yaml'
            include 'tsconfig*.json'
            include 'vite.config.*'
        },
        rootProject.layout.projectDirectory.file('VERSION')
    )
    outputs.dir(frontendDist)

    commandLine 'pnpm', 'run', 'build'
}

// Aggregate task used by the distribution build.
tasks.register('make') {

    dependsOn('npmBuild')
}
